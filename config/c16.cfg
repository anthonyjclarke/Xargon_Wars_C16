# Original fixed-origin memory layout from ULTRA, VARS and EXTRA-MEMORY (ca65/ld65).
# %B is replaced with the build directory. Only SHEETS and CODE go into the PRG;
# the zero-page and page-3 images are written only to check them against OBJ.
MEMORY {
    ZP:     start = $0002, size = $00FE, file = "%B/zeropage.bin";
    PAGE3:  start = $033C, size = $00C4, file = "%B/page3.bin";
    XTRA1:  start = $0400, size = $0100, file = "";
    XTRA2:  start = $0560, size = $0278, file = "";
    SHEETS: start = $1010, size = $0BF0, file = "%B/sheets.bin";
    CODE:   start = $1C80, size = $1F80, file = "%B/code.bin";
}
SEGMENTS {
    AT_0002: load = ZP,     type = rw;
    AT_033C: load = PAGE3,  type = rw;
    AT_0400: load = XTRA1,  type = bss;
    AT_0560: load = XTRA2,  type = bss;
    AT_1010: load = SHEETS, type = ro;
    AT_1C80: load = CODE,   type = ro;
}
